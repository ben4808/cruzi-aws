service: cruzi-aws
frameworkVersion: '4'

provider:
  name: aws
  runtime: nodejs20.x
  region: us-west-2
  stage: ${opt:stage, 'dev'}
  environment:
    NODE_ENV: ${self:provider.stage}
    # Database configuration
    DB_HOST: ${env:DB_HOST}
    DB_USER: ${env:DB_USER}
    DB_PASSWORD: ${env:DB_PASSWORD}
    DB_NAME: ${env:DB_NAME}
    DB_PORT: ${env:DB_PORT}

  iam:
    role:
      statements:
        # CloudWatch Logs permissions
        - Effect: Allow
          Action:
            - logs:CreateLogGroup
            - logs:CreateLogStream
            - logs:PutLogEvents
          Resource: "*"
        # EventBridge permissions (for scheduled executions)
        - Effect: Allow
          Action:
            - events:PutEvents
          Resource: "*"

package:
  include:
    - dist/**

functions:
  # Entry info generator - processes entries and generates sense information
  entryInfoGenerator:
    handler: dist/entryInfoGeneratorLambda.handler
    description: Processes crossword entries and generates sense information using AI
    timeout: 900  # 15 minutes - AI processing can take time
    memorySize: 1024  # 1GB - Need more memory for AI processing
    environment:
      DB_HOST: ${self:provider.environment.DB_HOST}
      DB_USER: ${self:provider.environment.DB_USER}
      DB_PASSWORD: ${self:provider.environment.DB_PASSWORD}
      GEMINI_API_KEY: ${self:provider.environment.GEMINI_API_KEY}

  # Example sentence generator - generates example sentences for senses
  exampleSentenceGenerator:
    handler: dist/exampleSentenceGeneratorLambda.handler
    description: Generates example sentences for crossword senses using AI
    timeout: 900  # 15 minutes - AI processing can take time
    memorySize: 1024  # 1GB - Need more memory for AI processing
    environment:
      DB_HOST: ${self:provider.environment.DB_HOST}
      DB_USER: ${self:provider.environment.DB_USER}
      DB_PASSWORD: ${self:provider.environment.DB_PASSWORD}
      GEMINI_API_KEY: ${self:provider.environment.GEMINI_API_KEY}

  # Crossword familiarity generator - generates familiarity scores and metadata
  crosswordFamiliarityGenerator:
    handler: dist/crosswordFamiliarityGeneratorLambda.handler
    description: Processes crossword entries and generates familiarity information using AI
    timeout: 900  # 15 minutes - AI processing can take time
    memorySize: 1024  # 1GB - Need more memory for AI processing
    environment:
      DB_HOST: ${self:provider.environment.DB_HOST}
      DB_USER: ${self:provider.environment.DB_USER}
      DB_PASSWORD: ${self:provider.environment.DB_PASSWORD}
      GEMINI_API_KEY: ${self:provider.environment.GEMINI_API_KEY}

  # Crossword quality generator - generates quality scores
  crosswordQualityGenerator:
    handler: dist/crosswordQualityGeneratorLambda.handler
    description: Processes crossword entries and generates quality scores using AI
    timeout: 900  # 15 minutes - AI processing can take time
    memorySize: 1024  # 1GB - Need more memory for AI processing
    environment:
      DB_HOST: ${self:provider.environment.DB_HOST}
      DB_USER: ${self:provider.environment.DB_USER}
      DB_PASSWORD: ${self:provider.environment.DB_PASSWORD}
      GEMINI_API_KEY: ${self:provider.environment.GEMINI_API_KEY}

custom:
  enableGenerators: ${env:ENABLE_GENERATORS, 'true'}

plugins:
  - serverless-offline
